<svg width="380" height="290" viewBox="0 0 380 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15152B"/>
      <stop offset="100%" stop-color="#1B1B36"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7">
        <animate attributeName="stop-color" values="#6C5CE7;#00CEC9;#6C5CE7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00CEC9">
        <animate attributeName="stop-color" values="#00CEC9;#6C5CE7;#00CEC9" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <style>
      .card { fill: url(#cardBg); stroke: url(#borderGrad); stroke-width: 1.6; rx: 16; }
      .heading { font-family: 'Segoe UI', sans-serif; font-weight: 700; font-size: 17px; fill: #F1F1FA; }
      .label { font-family: 'Segoe UI', sans-serif; font-weight: 600; font-size: 13px; fill: #9A93C9; }
      .value { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #D6D6F5; }
      .dot { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .4; r: 3; } 50% { opacity: 1; r: 4.5; } }
      .bar { animation: grow 1.6s ease-out forwards; transform-origin: left; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    </style>
  </defs>

  <rect class="card" x="2" y="2" width="376" height="286" rx="16"/>

  <text x="24" y="38" class="heading">⚡ Quick Facts</text>
  <line x1="24" y1="50" x2="356" y2="50" stroke="#2E2E52" stroke-width="1"/>

  <!-- Role -->
  <circle class="dot" cx="30" cy="76" r="3.5" fill="#00CEC9" style="animation-delay:0s"/>
  <text x="44" y="80" class="label">Role</text>
  <text x="130" y="80" class="value">Full Stack Developer</text>

  <!-- Focus -->
  <circle class="dot" cx="30" cy="106" r="3.5" fill="#A29BFE" style="animation-delay:0.3s"/>
  <text x="44" y="110" class="label">Focus</text>
  <text x="130" y="110" class="value">MERN · DSA</text>

  <!-- Languages -->
  <circle class="dot" cx="30" cy="136" r="3.5" fill="#FD79A8" style="animation-delay:0.6s"/>
  <text x="44" y="140" class="label">Languages</text>
  <text x="130" y="140" class="value">JS · Py · Java · C/C++</text>

  <!-- Status -->
  <circle class="dot" cx="30" cy="166" r="3.5" fill="#00CEC9" style="animation-delay:0.9s"/>
  <text x="44" y="170" class="label">Status</text>
  <text x="130" y="170" class="value">Open to opportunities</text>

  <!-- Location -->
  <circle class="dot" cx="30" cy="196" r="3.5" fill="#A29BFE" style="animation-delay:1.2s"/>
  <text x="44" y="200" class="label">Based in</text>
  <text x="130" y="200" class="value">India 🇮🇳</text>

  <line x1="24" y1="216" x2="356" y2="216" stroke="#2E2E52" stroke-width="1"/>

  <!-- skill confidence bars -->
  <text x="24" y="236" class="label">Core Stack Confidence</text>

  <text x="24" y="254" class="value" font-size="11">React / JS</text>
  <rect x="130" y="246" width="200" height="6" rx="3" fill="#2E2E52"/>
  <rect class="bar" x="130" y="246" width="180" height="6" rx="3" fill="#00CEC9" style="animation-delay:0.2s"/>

  <text x="24" y="270" class="value" font-size="11">Node / Express</text>
  <rect x="130" y="262" width="200" height="6" rx="3" fill="#2E2E52"/>
  <rect class="bar" x="130" y="262" width="160" height="6" rx="3" fill="#6C5CE7" style="animation-delay:0.4s"/>

  <text x="24" y="286" class="value" font-size="11">Python / Java</text>
  <rect x="130" y="278" width="200" height="6" rx="3" fill="#2E2E52"/>
  <rect class="bar" x="130" y="278" width="140" height="6" rx="3" fill="#FD79A8" style="animation-delay:0.6s"/>
</svg>
