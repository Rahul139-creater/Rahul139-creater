<svg width="380" height="400" viewBox="0 0 380 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15152B"/>
      <stop offset="100%" stop-color="#1B1B36"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7">
        <animate attributeName="stop-color" values="#6C5CE7;#00CEC9;#6C5CE7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00CEC9">
        <animate attributeName="stop-color" values="#00CEC9;#6C5CE7;#00CEC9" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <style>
      .card { fill: url(#cardBg); stroke: url(#borderGrad); stroke-width: 1.6; }
      .heading { font-family: 'Segoe UI', sans-serif; font-weight: 700; font-size: 19px; fill: #F1F1FA; }
      .label { font-family: 'Segoe UI', sans-serif; font-weight: 600; font-size: 14px; fill: #9A93C9; }
      .value { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #D6D6F5; }
      .small { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #B9B4E0; }
      .dot { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .4; r: 3.5; } 50% { opacity: 1; r: 5; } }
      .bar { animation: grow 1.6s ease-out forwards; transform-origin: left; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      .glowdot { animation: pulse2 2.4s ease-in-out infinite; }
      @keyframes pulse2 { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect class="card" x="2" y="2" width="376" height="396" rx="18"/>

  <text x="26" y="46" class="heading">⚡ Quick Facts</text>
  <line x1="26" y1="60" x2="354" y2="60" stroke="#2E2E52" stroke-width="1"/>

  <!-- Role -->
  <circle class="dot" cx="32" cy="90" r="3.5" fill="#00CEC9" style="animation-delay:0s"/>
  <text x="48" y="95" class="label">Role</text>
  <text x="150" y="95" class="value">Full Stack Developer</text>

  <!-- Focus -->
  <circle class="dot" cx="32" cy="126" r="3.5" fill="#A29BFE" style="animation-delay:0.3s"/>
  <text x="48" y="131" class="label">Focus</text>
  <text x="150" y="131" class="value">MERN · DSA</text>

  <!-- Languages -->
  <circle class="dot" cx="32" cy="162" r="3.5" fill="#FD79A8" style="animation-delay:0.6s"/>
  <text x="48" y="167" class="label">Languages</text>
  <text x="150" y="167" class="value">JS · Py · Java · C/C++</text>

  <!-- Status -->
  <circle class="dot" cx="32" cy="198" r="3.5" fill="#00CEC9" style="animation-delay:0.9s"/>
  <text x="48" y="203" class="label">Status</text>
  <text x="150" y="203" class="value">Open to opportunities</text>

  <!-- Location -->
  <circle class="dot" cx="32" cy="234" r="3.5" fill="#A29BFE" style="animation-delay:1.2s"/>
  <text x="48" y="239" class="label">Based in</text>
  <text x="150" y="239" class="value">India 🇮🇳</text>

  <line x1="26" y1="258" x2="354" y2="258" stroke="#2E2E52" stroke-width="1"/>

  <!-- skill confidence bars -->
  <text x="26" y="284" class="label">Core Stack Confidence</text>

  <text x="26" y="306" class="small">React / JS</text>
  <rect x="150" y="297" width="200" height="7" rx="3.5" fill="#2E2E52"/>
  <rect class="bar" x="150" y="297" width="180" height="7" rx="3.5" fill="#00CEC9" style="animation-delay:0.2s"/>

  <text x="26" y="332" class="small">Node / Express</text>
  <rect x="150" y="323" width="200" height="7" rx="3.5" fill="#2E2E52"/>
  <rect class="bar" x="150" y="323" width="160" height="7" rx="3.5" fill="#6C5CE7" style="animation-delay:0.4s"/>

  <text x="26" y="358" class="small">Python / Java</text>
  <rect x="150" y="349" width="200" height="7" rx="3.5" fill="#2E2E52"/>
  <rect class="bar" x="150" y="349" width="140" height="7" rx="3.5" fill="#FD79A8" style="animation-delay:0.6s"/>

  <line x1="26" y1="372" x2="354" y2="372" stroke="#2E2E52" stroke-width="1"/>
  <circle class="glowdot" cx="32" cy="386" r="4" fill="#00CEC9"/>
  <text x="48" y="391" class="small">Currently building &amp; shipping projects</text>
</svg>
