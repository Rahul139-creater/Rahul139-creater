<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B1E"/>
      <stop offset="100%" stop-color="#15152B"/>
    </linearGradient>

    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6C5CE7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00CEC9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00CEC9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FD79A8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FD79A8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A29BFE">
        <animate attributeName="stop-color" values="#A29BFE;#00CEC9;#A29BFE" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00CEC9">
        <animate attributeName="stop-color" values="#00CEC9;#A29BFE;#00CEC9" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .blob { animation: drift 9s ease-in-out infinite; }
      .blob2 { animation: drift 11s ease-in-out infinite reverse; }
      .blob3 { animation: drift 13s ease-in-out infinite; }
      @keyframes drift {
        0%   { transform: translate(0px, 0px) scale(1); }
        50%  { transform: translate(18px, -14px) scale(1.08); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      .particle { animation: floaty 4s ease-in-out infinite; }
      @keyframes floaty {
        0%   { transform: translateY(0px); opacity: 0.25; }
        50%  { transform: translateY(-10px); opacity: 0.9; }
        100% { transform: translateY(0px); opacity: 0.25; }
      }
      .title {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: url(#textGrad);
      }
      .subtitle {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-weight: 400;
        font-size: 18px;
        fill: #C9C9E8;
      }
      .badgeText {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 14px;
        fill: #8B7CF6;
      }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
      .underline {
        stroke: url(#textGrad);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 420;
        stroke-dashoffset: 420;
        animation: draw 2.4s ease-out forwards;
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .wave { animation: waveMove 6s linear infinite; }
      @keyframes waveMove {
        0% { transform: translateX(0); }
        100% { transform: translateX(-300px); }
      }
    </style>
  </defs>

  <rect width="900" height="280" fill="url(#bgGrad)"/>

  <!-- drifting gradient blobs -->
  <circle class="blob" cx="120" cy="60" r="160" fill="url(#blob1)"/>
  <circle class="blob2" cx="780" cy="220" r="180" fill="url(#blob2)"/>
  <circle class="blob3" cx="700" cy="40" r="120" fill="url(#blob3)"/>

  <!-- subtle animated wave line at bottom -->
  <path class="wave" d="M -300 250 Q -225 230 -150 250 T 0 250 T 150 250 T 300 250 T 450 250 T 600 250 T 750 250 T 900 250 T 1050 250 T 1200 250"
        fill="none" stroke="#6C5CE7" stroke-opacity="0.25" stroke-width="2"/>

  <!-- floating particles -->
  <circle class="particle" cx="80" cy="200" r="3" fill="#00CEC9" style="animation-delay:0s"/>
  <circle class="particle" cx="160" cy="150" r="2.5" fill="#A29BFE" style="animation-delay:0.6s"/>
  <circle class="particle" cx="740" cy="90" r="3" fill="#FD79A8" style="animation-delay:1.1s"/>
  <circle class="particle" cx="820" cy="160" r="2" fill="#00CEC9" style="animation-delay:1.6s"/>
  <circle class="particle" cx="650" cy="200" r="2.5" fill="#A29BFE" style="animation-delay:2.1s"/>
  <circle class="particle" cx="60" cy="90" r="2" fill="#FD79A8" style="animation-delay:0.3s"/>

  <!-- greeting badge -->
  <g transform="translate(60,44)">
    <rect x="0" y="0" width="200" height="30" rx="15" fill="#1A1A33" stroke="#6C5CE7" stroke-width="1"/>
    <circle cx="18" cy="15" r="4" fill="#00CEC9" class="particle"/>
    <text x="32" y="20" class="badgeText">Available for work</text>
  </g>

  <!-- main heading -->
  <text x="60" y="140" class="title" filter="url(#softGlow)">Hey, I'm Rahul<tspan class="cursor">|</tspan></text>
  <path class="underline" d="M 62 155 Q 220 172 400 155"/>

  <!-- subtitle -->
  <text x="60" y="195" class="subtitle">Full Stack Developer crafting MERN-powered web experiences</text>

  <!-- tech pills -->
  <g transform="translate(60,220)" font-family="JetBrains Mono, monospace" font-size="13" fill="#9A93C9">
    <text x="0" y="14">MERN</text>
    <text x="65" y="14">·</text>
    <text x="80" y="14">Python</text>
    <text x="145" y="14">·</text>
    <text x="160" y="14">Java</text>
    <text x="205" y="14">·</text>
    <text x="220" y="14">C/C++</text>
  </g>
</svg>
