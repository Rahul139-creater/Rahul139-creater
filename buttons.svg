<svg width="720" height="70" viewBox="0 0 720 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E63946">
        <animate attributeName="stop-color" values="#E63946;#B71C1C;#E63946" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#B71C1C">
        <animate attributeName="stop-color" values="#B71C1C;#E63946;#B71C1C" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#0F0F1A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur">
        <animate attributeName="stdDeviation" values="1.5;4;1.5" dur="2.2s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .btn { cursor: pointer; }
      .btn-bg {
        fill: url(#g2);
        stroke: url(#g1);
        stroke-width: 1.4;
        rx: 10;
        transition: all 0.3s ease;
      }
      .btn-text {
        font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 15px;
        fill: #F1F1F1;
        letter-spacing: 0.4px;
      }
      .icon { fill: #E63946; }
      .pulse {
        animation: pulseAnim 2.4s ease-in-out infinite;
        transform-origin: center;
      }
      @keyframes pulseAnim {
        0%   { opacity: 0.55; }
        50%  { opacity: 1; }
        100% { opacity: 0.55; }
      }
      .rise {
        animation: riseAnim 3s ease-in-out infinite;
      }
      @keyframes riseAnim {
        0%   { transform: translateY(0px); }
        50%  { transform: translateY(-2.5px); }
        100% { transform: translateY(0px); }
      }
    </style>
  </defs>

  <!-- Portfolio Button -->
  <a xlink:href="https://github.com/Rahul139-creater" target="_blank">
    <g class="btn rise" transform="translate(0,5)">
      <rect class="btn-bg" width="170" height="46" rx="10" filter="url(#glow)"/>
      <polygon class="icon pulse" points="20,30 27,16 34,30" />
      <text x="46" y="29" class="btn-text">Portfolio</text>
    </g>
  </a>

  <!-- LinkedIn Button -->
  <a xlink:href="https://www.linkedin.com/in/rahul-sharma-27aa5a331/" target="_blank">
    <g class="btn rise" transform="translate(185,5)" style="animation-delay:0.3s">
      <rect class="btn-bg" width="170" height="46" rx="10" filter="url(#glow)"/>
      <circle class="icon pulse" cx="26" cy="23" r="9"/>
      <text x="46" y="29" class="btn-text">LinkedIn</text>
    </g>
  </a>

  <!-- Email Button -->
  <a xlink:href="mailto:your.email@example.com" target="_blank">
    <g class="btn rise" transform="translate(370,5)" style="animation-delay:0.6s">
      <rect class="btn-bg" width="170" height="46" rx="10" filter="url(#glow)"/>
      <rect class="icon pulse" x="17" y="16" width="18" height="13" rx="2"/>
      <text x="46" y="29" class="btn-text">Email</text>
    </g>
  </a>

  <!-- GitHub Button -->
  <a xlink:href="https://github.com/Rahul139-creater" target="_blank">
    <g class="btn rise" transform="translate(555,5)" style="animation-delay:0.9s">
      <rect class="btn-bg" width="165" height="46" rx="10" filter="url(#glow)"/>
      <circle class="icon pulse" cx="26" cy="23" r="9"/>
      <text x="46" y="29" class="btn-text">GitHub</text>
    </g>
  </a>
</svg>
